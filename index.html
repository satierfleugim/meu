<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cartas Favoritas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #07142A;
      color: #ffffff;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #07142A;
      min-height: 100vh;
    }

    header, .search-box, .categories {
      background: #092142;
      color: white;
    }

    header {
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .profile-img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
    }

    .title-section {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .search-box {
      padding: 1rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem;
      border-radius: 20px;
      border: none;
      font-size: 1rem;
      background: #6B94B2;
      color: #000000;
    }

    .search-box input::placeholder {
      color: #000000;
    }

    .categories {
      display: flex;
      overflow-x: auto;
      gap: 0.6rem;
      padding: 0.5rem 1rem;
    }

    .category {
      padding: 0.4rem 1rem;
      background: #6B94B2;
      color: #07142A;
      border-radius: 25px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    .category.active {
      background: #10538A;
      color: white;
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
    }

    .card {
      background: #092142;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      height: 180px;
    }

    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
      border: none;
    }

    .card-text {
      padding: 0.4rem 0.5rem;
      text-align: center;
      font-weight: bold;
      background: #10538A;
      font-size: 0.95rem;
      color: white;
    }

    .card-text a {
      text-decoration: none;
      color: #ffffff;
    }

    .card-text a:hover {
      color: #6B94B2;
    }

    .category-label {
      font-size: 0.75rem;
      color: #6B94B2;
      text-align: center;
    }

    .card:focus,
    .category:focus,
    a:focus {
      outline: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header id="perfil-section"></header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Procurar por...">
    </div>

    <div class="categories" id="categoryList"></div>

    <div class="card-grid" id="cardGrid"></div>
  </div>

  <script>
    fetch('perfil.html').then(r => r.text()).then(html => {
      document.getElementById('perfil-section').innerHTML = html;
    });

    fetch('cartas.html').then(r => r.text()).then(html => {
      document.getElementById('cardGrid').innerHTML = html;
      gerarCategorias();
    });

    document.getElementById('searchInput').addEventListener('input', filtrarCartas);

    function gerarCategorias() {
      const cards = document.querySelectorAll('.card');
      const categorias = new Set();
      categorias.add('Todos');

      cards.forEach(c => categorias.add(c.dataset.category));

      const categoryList = document.getElementById('categoryList');
      categoryList.innerHTML = '';

      categorias.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'category';
        div.textContent = cat;
        div.dataset.category = cat;
        if (cat === 'Todos') div.classList.add('active');
        div.onclick = () => {
          document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
          div.classList.add('active');
          filtrarCartas();
        };
        categoryList.appendChild(div);
      });
    }

    function filtrarCartas() {
      const termo = document.getElementById('searchInput').value.toLowerCase();
      const categoria = document.querySelector('.category.active').dataset.category;
      document.querySelectorAll('.card').forEach(card => {
        const nome = card.querySelector('a').textContent.toLowerCase();
        const cat = card.dataset.category;
        const exibe = (categoria === 'Todos' || cat === categoria) && nome.includes(termo);
        card.style.display = exibe ? 'flex' : 'none';
      });
    }
  </script>

</body>
</html>
